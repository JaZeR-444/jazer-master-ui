name: iOS (SwiftUI)

on:
  push:
    branches: [main]
    paths:
      - 'native/ios-swiftui/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'native/ios-swiftui/**'
      - '.github/workflows/ios.yml'

jobs:
  swiftui:
    name: swift build · test (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native/ios-swiftui
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
