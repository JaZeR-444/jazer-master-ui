name: Flutter

on:
  push:
    branches: [main]
    paths:
      - 'native/flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'native/flutter/**'
      - '.github/workflows/flutter.yml'

jobs:
  flutter:
    name: analyze · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
