<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JaZeR Styles — demo</title>
    <!-- Run `pnpm --filter @jazer/styles build` first to generate dist/jazer.css -->
    <link rel="stylesheet" href="./dist/jazer.css" />
    <style>
      /* demo-only layout, not part of the design system */
      body {
        padding: 2rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="container stack">
      <h1 class="u-text-gradient">JaZeR Button</h1>
      <button class="btn btn--ghost" id="themeToggle" type="button">Toggle theme</button>

      <h2>Variants</h2>
      <div class="row">
        <button class="btn btn--primary" type="button">Primary</button>
        <button class="btn btn--secondary" type="button">Secondary</button>
        <button class="btn btn--ghost" type="button">Ghost</button>
        <button class="btn btn--gradient" type="button">Gradient</button>
      </div>

      <h2>Sizes</h2>
      <div class="row">
        <button class="btn btn--primary btn--sm" type="button">Small</button>
        <button class="btn btn--primary" type="button">Medium</button>
        <button class="btn btn--primary btn--lg" type="button">Large</button>
      </div>

      <h2>States</h2>
      <div class="row">
        <button class="btn btn--primary" type="button">Default</button>
        <button class="btn btn--primary" type="button" disabled>Disabled</button>
        <button class="btn btn--primary btn--block" type="button">Full width</button>
      </div>
    </div>

    <script>
      const root = document.documentElement;
      document.getElementById('themeToggle').addEventListener('click', () => {
        root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
      });
    </script>
  </body>
</html>
